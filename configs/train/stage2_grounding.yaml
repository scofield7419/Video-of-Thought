# Stage 2 - fine-grained video-scene grounding-aware tuning (L1-L5, paper Sec. 3.3)
# on Action Genome + WebVid video-STSG pairs.
# Trainable: projector + STSG encoder + LoRA. Frozen: CLIP, LLM weights.
init_from: checkpoints/motionepic-stage1
data_path: [data/sft/grounding_ag.jsonl, data/sft/grounding_webvid.jsonl]
frames_root: data/action_genome/frames
video_root: data/webvid/videos
sample_fps: 8.0
max_frames: 32
train_projector: true
train_stsg_encoder: true
lora_enable: true
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
mm_lr: 1.0e-4
model_max_length: 4096
output_dir: checkpoints/motionepic-stage2
bf16: true
tf32: true
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
weight_decay: 0.0
warmup_ratio: 0.03
lr_scheduler_type: cosine
logging_steps: 10
save_strategy: steps
save_steps: 2000
save_total_limit: 2
dataloader_num_workers: 8
gradient_checkpointing: true
report_to: tensorboard
